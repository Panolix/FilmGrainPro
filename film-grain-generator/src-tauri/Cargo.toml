[package]
name = "film-grain-generator"
version = "2.2.0"
description = "Film Grain Generator - Professional film grain effects"
authors = ["Panagiotis Smponias"]
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/Panolix/FilmGrainPro"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
tauri = { version = "2.4.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
rand = "0.8"
rayon = "1.10"
dirs = "5.0"
base64 = "0.21"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

default = []

# Release optimizations
[profile.release]
opt-level = 3          # Maximum optimization
lto = true            # Link-time optimization
codegen-units = 1     # Better optimization at cost of compile time
panic = "abort"       # Smaller binary size
strip = true          # Remove debug symbols

[profile.dev]
opt-level = 1         # Some optimization in dev for better performance
