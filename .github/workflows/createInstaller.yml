name: Build Installers

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.0.8)'
        required: true
        default: 'v1.0.8'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          # Verify webkit installation
          dpkg -l | grep libwebkit2gtk || echo "WebKit packages installed successfully"

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install frontend dependencies
        run: cd film-grain-generator && npm install

      - name: Verify Inter font is bundled
        run: |
          cd film-grain-generator
          npm run build
          node -e "if (!require('fs').existsSync('dist/fonts/InterVariable.woff2')) { console.error('Inter font missing from build'); process.exit(1); } console.log('Inter font bundled');"

      - name: Read release notes
        id: notes
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat RELEASE_NOTES.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './film-grain-generator'
          tagName: ${{ github.event.release.tag_name || github.ref_name }}
          releaseName: 'Film Grain Generator v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: false

      - name: Fix DMG volume icon and re-upload
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd film-grain-generator
          shopt -s nullglob
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg src-tauri/target/*/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "No DMG found"
            exit 1
          fi
          tag="${{ github.event.release.tag_name || github.ref_name }}"
          for dmg in "${dmgs[@]}"; do
            bash scripts/fix-dmg-volume-icon.sh "$dmg"
            gh release upload "$tag" "$dmg" --clobber
          done